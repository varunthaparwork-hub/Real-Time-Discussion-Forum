# Full-stack Docker Compose for the Real-Time Discussion Forum.
# Runs all 4 services + PostgreSQL + Redis with a single command:
#   docker-compose up --build
#
# Services:
#   postgres  — PostgreSQL 15 (creates auth_db, forum_db, notification_db)
#   redis     — Redis 7 (caching + event streaming)
#   auth      — Django auth service (port 8001)
#   forum     — FastAPI forum service (port 8000)
#   notifier  — FastAPI notification service (port 8003)
#   frontend  — React SPA (port 5173)
version: '3.9'

services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: forum_postgres_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: forum_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Auth Service (Django) ───────────────────────────────────────
  auth:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: forum_auth_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - JWT_SECRET_KEY=my_very_long_super_secure_secret_key_2026_abc123
      - ALLOWED_HOSTS=localhost,127.0.0.1,auth,0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  # ── Forum Service (FastAPI) ────────────────────────────────────
  forum:
    build:
      context: ../forum-service
      dockerfile: Dockerfile
    container_name: forum_forum_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/forum_db
      - JWT_SECRET_KEY=my_very_long_super_secure_secret_key_2026_abc123
      - JWT_ALGORITHM=HS256
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  # ── Notification Service (FastAPI) ─────────────────────────────
  notifier:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: forum_notification_service
    restart: always
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/notification_db
      - JWT_SECRET_KEY=my_very_long_super_secure_secret_key_2026_abc123
      - JWT_ALGORITHM=HS256
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (React SPA) ───────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: forum_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - auth
      - forum
      - notifier

volumes:
  postgres_data:
  redis_data: